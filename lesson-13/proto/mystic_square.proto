syntax = "proto3";

package mysticsquare.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "mystic-square-grpc/gen/mysticsquare;mysticsquare";

enum RegistrationStatus {
  REGISTRATION_STATUS_UNSPECIFIED = 0;
  UNREGISTERED = 1;
  PENDING = 2;
  MAIL_CONFIRMED = 3;
  REGISTERED = 4;
}

message Registration {
  uint64 id = 1;
  string email = 2;
  string full_name = 3;
  RegistrationStatus status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message RegisterRequest {
  string email = 1;
  string full_name = 2;
}

message RegistrationRequest {
  uint64 registration_id = 1;
}

message WatchRegistrationRequest {
  uint64 registration_id = 1;
  int32 max_events = 2;
}

message RegistrationStatusEvent {
  uint64 registration_id = 1;
  RegistrationStatus status = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string message = 4;
  int64 sequence = 5;
}

message CreateGameRequest {
  int32 rows = 1;
  int32 columns = 2;
}

message GameSnapshot {
  uint64 id = 1;
  repeated int32 board = 2;
  int32 moves = 3;
  bool is_win = 4;
  bool is_over = 5;
}

message GetGameRequest {
  uint64 game_id = 1;
}

message GameMove {
  uint64 game_id = 1;
  int32 row = 2;
  int32 column = 3;
  int64 sequence = 4;
}

message MoveRejection {
  int64 sequence = 1;
  string reason = 2;
}

message GameMoveSummary {
  uint64 game_id = 1;
  int32 received = 2;
  int32 applied = 3;
  int32 rejected = 4;
  bool is_win = 5;
  bool is_over = 6;
  repeated int32 board = 7;
  repeated MoveRejection rejections = 8;
}

service MysticSquareService {
  rpc Register(RegisterRequest) returns (Registration) {
    option (google.api.http) = {
      post: "/v1/registrations"
      body: "*"
    };
  }
  rpc ConfirmRegistration(RegistrationRequest) returns (Registration) {
    option (google.api.http) = {
      patch: "/v1/registrations/{registration_id}/confirm"
      body: "*"
    };
  }
  rpc CompleteRegistration(RegistrationRequest) returns (Registration) {
    option (google.api.http) = {
      patch: "/v1/registrations/{registration_id}/complete"
      body: "*"
    };
  }
  rpc WatchRegistrationStatus(WatchRegistrationRequest)
      returns (stream RegistrationStatusEvent) {
    option (google.api.http) = {
      get: "/v1/registrations/{registration_id}/watch"
    };
  }
  rpc CreateGame(CreateGameRequest) returns (GameSnapshot) {
    option (google.api.http) = {
      post: "/v1/games"
      body: "*"
    };
  }
  rpc GetGame(GetGameRequest) returns (GameSnapshot) {
    option (google.api.http) = {
      get: "/v1/games/{game_id}"
    };
  }
  rpc SubmitGameMoves(stream GameMove) returns (GameMoveSummary);
}
